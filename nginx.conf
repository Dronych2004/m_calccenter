# ============================================================
# nginx.conf для calccenter.ru
# Скопируйте эти правила в настройки nginx на хостинге
# (обычно в панели: Настройки → Nginx → Дополнительные директивы)
# ============================================================

# HTTP → HTTPS (301)
server {
    listen 80;
    server_name calccenter.ru www.calccenter.ru;
    return 301 https://calccenter.ru$request_uri;
}

# Основной сервер
server {
    listen 443 ssl http2;
    server_name calccenter.ru;

    root /var/www/calccenter.ru/public;
    index index.html;

    # SSL (если хостинг предоставляет сертификат)
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    # www → non-www (301)
    if ($host = www.calccenter.ru) {
        return 301 https://calccenter.ru$request_uri;
    }

    # Trailing slash → без слэша (301)
    # /mortgage/ → /mortgage (query string сохраняем)
    location ~ ^(.+)/$ {
        return 301 https://calccenter.ru$1$is_args$args;
    }

    # Clean URLs: /mortgage → /mortgage/index.html (prerendered).
    # ВАЖНО: $uri/index.html идёт ДО $uri/ — иначе /mortgage через внутренний
    # редирект на /mortgage/ попадает в правило выше и получается цикл 301.
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # Кэширование статики
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
    }

    # Кэширование HTML (1 час — для обновления контента)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Без кэша для sitemap и robots
    location = /sitemap.xml {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/xml text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
